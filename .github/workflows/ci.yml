# CI: ビルド・整形検査・静的解析・テスト・コード生成の冪等性、
#     カバレッジゲート、そして契約ガバナンス（API / メッセージスキーマの後方互換）。
#
# 各ジョブは検査そのものを書かず、リポジトリルートの Makefile のターゲットを呼ぶだけである。
# モジュール一覧の単一情報源は Makefile の MODULES 変数であり、モジュールを 1 つ足しても
# このワークフローは 1 行も変わらない。ローカルで `make ci` を打てば ci ジョブと同じ検査一式が
# そのまま再現される（手順が CI とローカルで drift しない）。
#
# セキュリティ方針:
#   - permissions は最小権限（contents: read）。書き込み権限は付与しない。
#   - シークレットは一切使わない。したがって fork からの PR でも安全に実行できる
#     （pull_request イベントは fork PR にシークレットを渡さない。危険な
#      pull_request_target は使わない）。
#   - アクションはバージョンでピン留めする。横断／Docker ツール（golangci-lint / oasdiff /
#     govulncheck / goimports）の版は tools/versions.env を単一情報源として参照する。
#     コード生成ツール（ogen / sqlc / mockgen）は各モジュールの go.mod tool ディレクティブで
#     固定し、go generate は `go tool` 経由で解決する（PATH 依存の手動 install は不要）。
#     いずれも dev/CI 専用でランタイム依存には持ち込まない。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同時実行を抑制（同一 ref の古い実行はキャンセル）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小権限。読み取りのみ。
permissions:
  contents: read

jobs:
  # ビルド・静的解析・テスト・生成冪等性・カバレッジ。
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Go をセットアップ
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: 版を読み込む（tools/versions.env → GITHUB_ENV）
        run: |
          set -euo pipefail
          # 横断ツールの版は tools/versions.env を単一情報源として読み込む。以降の複数 step から
          # シェル変数 $<KEY> や式コンテキストの env.<KEY> として参照できるよう GITHUB_ENV へ流し、
          # ジョブ全体に効かせる（step ごとに versions.env を読み直さない = 参照経路を 1 本に保つ）。
          #
          # 注意: このファイル内では、コメントの中であっても GitHub の式記法（二重波括弧で囲んだ
          # 部分）が先に解釈される（run: の本文も対象）。プレースホルダを含む不正な式を書くと
          # ワークフロー全体が無効になり、ジョブが 1 つも起動しないまま「workflow file issue」で
          # 失敗する。コメントに式記法をそのまま書かないこと。
          set -a && . ./tools/versions.env && set +a
          echo "GOLANGCI_LINT_VERSION=$GOLANGCI_LINT_VERSION" >> "$GITHUB_ENV"
          echo "GOIMPORTS_VERSION=$GOIMPORTS_VERSION" >> "$GITHUB_ENV"

      - name: ツールをインストール（goimports）
        run: |
          set -euo pipefail
          # ogen / sqlc / mockgen は go.mod の tool ディレクティブで解決するため手動 install しない
          # （go generate が `go tool` で呼ぶ）。ここで導入するのは整形チェック用の goimports のみ
          # （版は versions.env 由来）。
          go install golang.org/x/tools/cmd/goimports@${GOIMPORTS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: ツールをインストール（golangci-lint）
        run: |
          set -euo pipefail
          # golangci-lint（depguard による層／seam の境界強制を含む）。版は tools/versions.env が
          # 単一情報源。公式 action ではなく go install を使う理由は 2 つある。
          #   1) action は本質的に「1 モジュール 1 呼び出し」の形であり、go.work のマルチモジュール
          #      構成ではモジュール数だけ step が増える。検査の入口を Makefile へ寄せる方針
          #      （モジュール一覧は MODULES 変数 1 箇所）と両立しない。
          #   2) action の install-mode: goinstall は内部的にこれと同じ `go install` である。
          #      golangci-lint は「ビルドに使った Go >= 対象モジュールの go ディレクティブ」を
          #      要求するため、いずれにせよ CI の Go(1.26) でソースからビルドする必要がある
          #      （配布バイナリでは go 1.26.0 のモジュールを lint できない）。
          # 引き換えに失うのは action のキャッシュのみで、検査内容は同一である。
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: コード生成の冪等性を検証
        # 生成物はコミット済み。再生成して差分が出たら失敗させる。
        run: make generate-check

      - name: 整形検査（gofmt / goimports）
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: golangci-lint
        run: make lint

      - name: 規約ゲート（convention-gate）
        # lint で表現できない規約（テスト関数名の主題の一意性・t.Run とテーブル駆動 name の
        # 8 語語彙・カタログ的ファイル名・package 名 = ディレクトリ名・日本語と英数の間の半角スペース）。
        #
        # このワークフローは make ci を呼ばず個別ターゲットを呼ぶ設計なので、Makefile の ci の
        # 依存に conventions を足しただけでは CI で 1 度も走らない。ここに step を足して初めて
        # マージ前ゲートになる（step 分割は「どの検査で落ちたか」がログで一目でわかる利点が
        # あるので、make ci 一発呼び出しには変えない）。
        run: make conventions

      - name: ビルド（統合タグのコンパイル検証を含む）
        # 通常ビルドに加え、統合テスト（build tag integration、DB 接続時のみ実行）が
        # コンパイル可能であることを -run='^$' で検証する（DB 不要・テストは実行しない）。
        run: make build

      - name: テスト（-race）
        run: make test-race

      - name: カバレッジゲート（domain + application >= 80%／モジュール）
        run: make cover

  # 契約ガバナンス: API / メッセージスキーマの後方互換ゲート。
  # コード変更とは独立した関心事なので別ジョブにする。
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Go をセットアップ
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: 契約ゲート用ツールをインストール（oasdiff）
        run: |
          set -euo pipefail
          # oasdiff は OpenAPI の破壊的変更検出ツール（dev/CI 専用。ランタイム依存ではない）。
          # 版は tools/versions.env を単一情報源として参照する（ハードコードしない）。
          # jq は Ubuntu ランナーにプリインストール済み（イベントスキーマの互換チェックに使う）。
          set -a && . ./tools/versions.env && set +a
          go install github.com/oasdiff/oasdiff@${OASDIFF_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 契約の後方互換（OpenAPI = oasdiff / メッセージ = type・required の不変性）
        run: make contracts

  # サプライチェーン: 依存関係の既知脆弱性スキャン（govulncheck）。
  # コード・契約とは独立した関心事なので別ジョブにする。脆弱性データベースは
  # 実行時に取得されるため、常に最新の検出内容でスキャンされる。
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Go をセットアップ
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: govulncheck をインストール
        run: |
          set -euo pipefail
          # govulncheck は Go 公式のサプライチェーン脆弱性スキャナ（dev/CI 専用。
          # ランタイム依存には持ち込まない）。版は tools/versions.env を単一情報源として参照する。
          set -a && . ./tools/versions.env && set +a
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 既知脆弱性スキャン（govulncheck、全モジュール）
        run: make vuln
