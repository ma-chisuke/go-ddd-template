# CI: ビルド・整形検査・静的解析・テスト・コード生成の冪等性、
#     カバレッジゲート、そして契約ガバナンス（API / メッセージスキーマの後方互換）。
#
# セキュリティ方針:
#   - permissions は最小権限（contents: read）。書き込み権限は付与しない。
#   - シークレットは一切使わない。したがって fork からの PR でも安全に実行できる
#     （pull_request イベントは fork PR にシークレットを渡さない。危険な
#      pull_request_target は使わない）。
#   - アクションはバージョンでピン留めする。横断／Docker ツール（golangci-lint / oasdiff /
#     govulncheck / goimports）の版は tools/versions.env を単一情報源として参照する。
#     コード生成ツール（ogen / sqlc / mockgen）は各モジュールの go.mod tool ディレクティブで
#     固定し、go generate は `go tool` 経由で解決する（PATH 依存の手動 install は不要）。
#     いずれも dev/CI 専用でランタイム依存には持ち込まない。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同時実行を抑制（同一 ref の古い実行はキャンセル）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小権限。読み取りのみ。
permissions:
  contents: read

jobs:
  # ビルド・静的解析・テスト・生成冪等性・カバレッジ。
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Go をセットアップ
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: 版を読み込む（tools/versions.env → GITHUB_ENV）
        run: |
          set -euo pipefail
          # 横断ツールの版は tools/versions.env を単一情報源として読み込む。golangci-lint-action
          # の with: は bash 展開（${VAR}）が効かないため、GITHUB_ENV 経由で後続 step から
          # ${{ env.GOLANGCI_LINT_VERSION }} として参照できるようにする（goimports も同様に流す）。
          set -a && . ./tools/versions.env && set +a
          echo "GOLANGCI_LINT_VERSION=$GOLANGCI_LINT_VERSION" >> "$GITHUB_ENV"
          echo "GOIMPORTS_VERSION=$GOIMPORTS_VERSION" >> "$GITHUB_ENV"

      - name: ツールをインストール（goimports）
        run: |
          set -euo pipefail
          # ogen / sqlc は go.mod の tool ディレクティブで解決するため手動 install しない
          # （go generate が `go tool` で呼ぶ）。golangci-lint は下の公式 action が導入する。
          # ここで導入するのは整形チェック用の goimports のみ（版は versions.env 由来）。
          go install golang.org/x/tools/cmd/goimports@${GOIMPORTS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: コード生成の冪等性を検証
        run: |
          set -euo pipefail
          # 生成物はコミット済み。再生成して差分が出たら失敗させる。
          (cd clients/inventory && go generate ./...)
          (cd contexts/inventory && go generate ./...)
          (cd contexts/ordering && go generate ./...)
          if ! git diff --exit-code; then
            echo "::error::生成物が最新ではありません。各モジュールで 'go generate ./...' を実行してコミットしてください。"
            exit 1
          fi

      - name: 整形検査（gofmt / goimports）
        run: |
          set -euo pipefail
          if [ -n "$(gofmt -l shared clients contexts cmd)" ]; then
            echo "::error::gofmt 未整形のファイルがあります:"; gofmt -l shared clients contexts cmd; exit 1
          fi
          if [ -n "$(goimports -l shared clients contexts cmd)" ]; then
            echo "::error::goimports 未整形のファイルがあります:"; goimports -l shared clients contexts cmd; exit 1
          fi

      - name: go vet
        run: |
          set -euo pipefail
          (cd shared && go vet ./...)
          (cd clients/inventory && go vet ./...)
          (cd contexts/inventory && go vet ./...)
          (cd contexts/ordering && go vet ./...)
          (cd cmd/dev && go vet ./...)

      # golangci-lint（depguard による層／seam の境界強制を含む）。
      # 版は tools/versions.env が単一情報源（上の「版を読み込む」step で GITHUB_ENV に流した
      # ${{ env.GOLANGCI_LINT_VERSION }} を参照）。install-mode: goinstall で、その版をソースから
      # CI の Go(1.26) でビルドして実行する。※ 既定の binary モードは配布済みバイナリを取得するが、
      # golangci-lint は「ビルドに使った Go >= 対象モジュールの go ディレクティブ」を要求するため、
      # 古い Go でビルドされた配布バイナリでは go 1.26.0 のモジュールを lint できない（版は据え置き、
      # ビルドに使う Go だけを 1.26 にして解決する）。
      # go.work のマルチモジュール構成では 1 モジュールずつ working-directory を指定し、
      # 5 モジュール（shared / clients/inventory / contexts/inventory / contexts/ordering / cmd/dev）
      # を漏れなく lint する（従来の 5 回実行と同等の網羅を保つ）。
      - name: golangci-lint（shared）
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-mode: goinstall
          working-directory: shared

      - name: golangci-lint（clients/inventory）
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-mode: goinstall
          working-directory: clients/inventory

      - name: golangci-lint（contexts/inventory）
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-mode: goinstall
          working-directory: contexts/inventory

      - name: golangci-lint（contexts/ordering）
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-mode: goinstall
          working-directory: contexts/ordering

      - name: golangci-lint（cmd/dev）
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-mode: goinstall
          working-directory: cmd/dev

      - name: ビルド（統合タグのコンパイル検証を含む）
        run: |
          set -euo pipefail
          (cd shared && go build ./...)
          (cd clients/inventory && go build ./...)
          # 通常ビルドに加え、統合テスト（build tag integration、DB 接続時のみ実行）が
          # コンパイル可能であることを -run='^$' で検証する（DB 不要・テストは実行しない）。
          (cd contexts/inventory && go build ./... && go test -tags=integration -run='^$' ./...)
          (cd contexts/ordering && go build ./... && go test -tags=integration -run='^$' ./...)
          (cd cmd/dev && go build ./...)

      - name: テスト（-race）
        run: |
          set -euo pipefail
          (cd shared && go test -race ./...)
          (cd contexts/inventory && go test -race ./...)
          (cd contexts/ordering && go test -race ./...)
          (cd cmd/dev && go test -race ./...)

      - name: カバレッジゲート（domain + application >= 80%／モジュール）
        run: bash scripts/coverage-gate.sh

  # 契約ガバナンス: API / メッセージスキーマの後方互換ゲート。
  # コード変更とは独立した関心事なので別ジョブにする。
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Go をセットアップ
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: 契約ゲート用ツールをインストール（oasdiff）
        run: |
          set -euo pipefail
          # oasdiff は OpenAPI の破壊的変更検出ツール（dev/CI 専用。ランタイム依存ではない）。
          # 版は tools/versions.env を単一情報源として参照する（ハードコードしない）。
          # jq は Ubuntu ランナーにプリインストール済み（イベントスキーマの互換チェックに使う）。
          set -a && . ./tools/versions.env && set +a
          go install github.com/oasdiff/oasdiff@${OASDIFF_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: OpenAPI 契約の後方互換（oasdiff、released ベースライン比較）
        run: bash contracts/check-openapi-compat.sh

      - name: メッセージ契約の後方互換（イベント／コマンドの JSON スキーマ）
        run: bash contracts/events/check-compat.sh

  # サプライチェーン: 依存関係の既知脆弱性スキャン（govulncheck）。
  # コード・契約とは独立した関心事なので別ジョブにする。脆弱性データベースは
  # 実行時に取得されるため、常に最新の検出内容でスキャンされる。
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Go をセットアップ
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: govulncheck をインストール
        run: |
          set -euo pipefail
          # govulncheck は Go 公式のサプライチェーン脆弱性スキャナ（dev/CI 専用。
          # ランタイム依存には持ち込まない）。版は tools/versions.env を単一情報源として参照する。
          set -a && . ./tools/versions.env && set +a
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 既知脆弱性スキャン（govulncheck、全モジュール）
        run: |
          set -euo pipefail
          (cd shared && govulncheck ./...)
          (cd clients/inventory && govulncheck ./...)
          (cd contexts/inventory && govulncheck ./...)
          (cd contexts/ordering && govulncheck ./...)
          (cd cmd/dev && govulncheck ./...)
