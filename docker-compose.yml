# デモ用の docker compose 定義。
#
# `docker compose up` で「PostgreSQL の起動 → スキーマ適用 → 在庫サービス起動」まで
# 手作業なしで立ち上がる。
#
# 重要（セキュリティ）: 以下の認証情報はすべてデモ専用である。
# 本番環境では絶対に使わず、秘密情報は環境変数や秘密管理サービスから注入すること。
# 認証情報はイメージには一切焼き込んでいない（すべて実行時の環境変数）。

services:
  # PostgreSQL 本体。
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: inventory       # デモ専用
      POSTGRES_PASSWORD: inventory    # デモ専用（本番では秘密管理を使うこと）
      POSTGRES_DB: inventory
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 2s
      timeout: 3s
      retries: 30

  # スキーマ適用用の使い捨てコンテナ（宣言的スキーマの初期適用）。
  # db が healthy になってから schema.sql を psql で流し込む。
  # schema.sql は IF NOT EXISTS を使った冪等な DDL なので、再実行しても安全。
  # スキーマが育ってきたら、差分適用ツール（sqldef 等）へ置き換えるとよい。
  migrate:
    image: postgres:17-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: inventory   # デモ専用
    volumes:
      - ./contexts/inventory/db/schema.sql:/schema.sql:ro
    entrypoint: ["sh", "-c", "psql -h db -U inventory -d inventory -v ON_ERROR_STOP=1 -f /schema.sql"]

  # 在庫サービス。db が healthy かつ migrate が正常終了してから起動する。
  inventory-service:
    build:
      context: .
      dockerfile: contexts/inventory/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # デモ専用の接続情報。実行時の環境変数として渡す（イメージには含めない）。
      DATABASE_URL: "postgres://inventory:inventory@db:5432/inventory?sslmode=disable"
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
