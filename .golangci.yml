# golangci-lint の設定。CI のマージ前ゲートとして実行する。
# 生成ファイル（ogen / sqlc の出力）は "Code generated ... DO NOT EDIT." ヘッダにより
# 既定で解析対象外になる。
run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - depguard
    - stylecheck
    # 以下は規約（CONVENTIONS.md の A / E / G 群、docs/testing-conventions.md の C 群）を
    # 機械強制するために足したもの。**追加した rule は必ずカナリア検証する**（G-1）——
    # 「rule が在る + lint が green」だけでは、設定の綴り間違いで rule が黙って何も
    # 検査していない状態を検出できない（ツリーに違反が無ければ green は自動的に通る）。
    - revive        # A-2 receiver-naming / A-9b var-naming
    - godot         # E-1 doc コメントの句点（日本語の「。」を認識する）
    - testpackage   # C-4 外部テストパッケージ（既定 skip-regexp が export/internal_test.go を除外）
    - thelper       # C-3 ヘルパーの t.Helper()
    - paralleltest  # C-5 t.Parallel()（下の exclude-rules でパス限定する）
    - tparallel     # C-5 t.Parallel() の誤用検出（こちらは全体に効かせる）
    - testifylint   # C-4c testify の落とし穴（expected-actual の引数順など）

linters-settings:
  goimports:
    local-prefixes: github.com/example/go-ddd-template
  revive:
    # var-naming と receiver-naming の 2 つだけを有効化する。revive の既定セット全体を
    # 入れると、この規約の範囲を超える指摘（exported コメントの体裁など）が大量に出る。
    # rules を明示すると revive はそのリストだけを走らせる。
    rules:
      - name: var-naming    # A-9b MixedCaps（下線で語をつなげない）。テスト関数名は報告しない
      - name: receiver-naming # A-2 同じ型の全メソッドでレシーバ名を一貫させる
  godot:
    # 宣言（トップレベルの型・関数・変数）の doc コメントだけを対象にする。
    # 行コメントまで対象にすると、why を書いた説明コメントに句点を強制することになる。
    scope: declarations
  stylecheck:
    # ST1000: 非 main パッケージは package コメントを持つこと。
    #
    # golangci-lint の既定では ST1000 は除外されているため、明示的に有効化する必要がある
    # （enable: stylecheck だけでは発火しない）。
    #
    # なぜ revive の package-comments ではないのか: revive は package コメントが
    # `Package <name>` で始まることを要求し、Go の main パッケージの慣習である
    # `// Command <name> ...` 形式（cmd/dev・contexts/*/cmd/* の 3 つが採用）を違反として
    # 弾いてしまう。ST1000 は main パッケージを対象外にするため、既存の正しい doc を
    # 壊さずに「ドメインパッケージだけが無言」という欠落だけを塞げる。
    #
    # ST1005: エラー文言は大文字始まりにせず句読点で終えない（A-6）。
    #
    # **ST1003（命名）は追加しない。** revive の var-naming と重複して二重報告になるため、
    # 命名の役割は revive 1 つに寄せる。
    #
    # ST1005 は**日本語のエラー文言を誤検出しない**（実測: 「在庫が不足しています。」
    # 「…は必須です」は無指摘で、英語の "Stock is insufficient." のみ指摘）。
    # F-1 が日本語のエラー文言を定めているので、この性質は必須の前提である。
    #
    # 生成コード（ogen / sqlc / mockgen の出力）の除外リストはここに書かない。
    # いずれも `Code generated ... DO NOT EDIT.` ヘッダを持ち、golangci-lint の既定の
    # 自動生成除外が効く（明示リストは二重管理になり、新しい生成物への追随を忘れる）。
    checks: ["ST1000", "ST1005"]
  depguard:
    # depguard で層の依存方向を機械的に守る。依存は常に内側（domain）へ向き、
    # 外側（adapter）が内側を知ってよいが、内側は外側を知らない。
    rules:
      # 1) 純粋なドメイン層: 永続化・HTTP・フレームワーク・アダプタに依存しない。
      domain-purity:
        files:
          - "**/internal/domain/**"
        deny:
          - pkg: "github.com/jackc/pgx"
            desc: "ドメイン層は永続化に依存してはならない（application 層のポート経由で分離する）"
          - pkg: "github.com/ogen-go/ogen"
            desc: "ドメイン層は HTTP/フレームワークに依存してはならない"
          - pkg: "net/http"
            desc: "ドメイン層は IO/フレームワークに依存してはならない"
          - pkg: "database/sql"
            desc: "ドメイン層は永続化に依存してはならない"
          - pkg: "github.com/example/go-ddd-template/contexts/inventory/internal/adapter"
            desc: "ドメイン層はアダプタ（inbound/outbound）に依存してはならない"
          - pkg: "github.com/example/go-ddd-template/contexts/ordering/internal/adapter"
            desc: "ドメイン層はアダプタ（inbound/outbound）に依存してはならない"
          - pkg: "github.com/example/go-ddd-template/clients/inventory"
            desc: "ドメイン層は生成クライアント（外部サービスの契約）に依存してはならない"
      # 2) アプリケーション層: ポート（interface）を定義する側。アダプタに依存しない
      #    （依存はポート経由で逆転させる = 依存性逆転の原則）。永続化ドライバ（pgx）にも
      #    直接依存しない: 純粋な shared/uow のみを import し、その pgx 実装
      #    shared/uow/pgxuow は outbound アダプタ環に閉じる。
      #    テストは統合検証のためにアダプタを結線してよいので _test.go は対象外にする。
      application-no-adapter:
        files:
          - "**/internal/application/**"
          - "!**/*_test.go"
        deny:
          - pkg: "github.com/jackc/pgx"
            desc: "アプリケーション層は永続化ドライバ（pgx）に依存してはならない（純粋な shared/uow のみを import し、pgx 実装 shared/uow/pgxuow は outbound アダプタ環に閉じる）"
          - pkg: "github.com/example/go-ddd-template/contexts/inventory/internal/adapter"
            desc: "アプリケーション層はアダプタに依存してはならない（ポートを定義し、アダプタに実装させる）"
          - pkg: "github.com/example/go-ddd-template/contexts/ordering/internal/adapter"
            desc: "アプリケーション層はアダプタに依存してはならない（ポートを定義し、アダプタに実装させる）"
          - pkg: "github.com/example/go-ddd-template/clients/inventory"
            desc: "アプリケーション層は生成クライアントに直接依存してはならない（ACL ポートを定義し、aclhttp に実装させる）"
      # 3) 受信アダプタ(inbound=入口)は送信アダプタ(outbound=出口)を直接 import しない。
      #    取り違え防止。両者の結線は合成ルート（ファサード / cmd）だけで行う。
      #    テスト（httptest 等）はアダプタを結線してよいので _test.go は対象外にする。
      inbound-not-outbound:
        files:
          - "**/internal/adapter/inbound/**"
          - "!**/*_test.go"
        deny:
          - pkg: "github.com/example/go-ddd-template/contexts/inventory/internal/adapter/outbound"
            desc: "受信アダプタ(inbound)は送信アダプタ(outbound)を直接 import してはならない（結線は合成ルートで）"
          - pkg: "github.com/example/go-ddd-template/contexts/ordering/internal/adapter/outbound"
            desc: "受信アダプタ(inbound)は送信アダプタ(outbound)を直接 import してはならない（結線は合成ルートで）"
      # 4) 送信アダプタ(outbound=出口)は受信アダプタ(inbound=入口)を直接 import しない。
      outbound-not-inbound:
        files:
          - "**/internal/adapter/outbound/**"
          - "!**/*_test.go"
        deny:
          - pkg: "github.com/example/go-ddd-template/contexts/inventory/internal/adapter/inbound"
            desc: "送信アダプタ(outbound)は受信アダプタ(inbound)を直接 import してはならない"
          - pkg: "github.com/example/go-ddd-template/contexts/ordering/internal/adapter/inbound"
            desc: "送信アダプタ(outbound)は受信アダプタ(inbound)を直接 import してはならない"
      # 5) 注文コンテキストは在庫コンテキストの Go パッケージを import しない（seam の境界規則）。
      #    在庫へは生成クライアント clients/inventory を介して HTTP 越しにのみ到達する。
      #    腐敗防止層（aclhttp）が clients/inventory を使い、contexts/inventory は決して使わない。
      #    テストも含めてこの境界を守る（_test.go を除外しない）。
      ordering-no-inventory-context:
        files:
          - "**/contexts/ordering/**"
        deny:
          - pkg: "github.com/example/go-ddd-template/contexts/inventory"
            desc: "注文コンテキストは在庫コンテキストの Go パッケージを import してはならない（clients/inventory 経由で HTTP 越しにのみ到達する）"
      # 6) 開発ハーネス（cmd/dev）は各コンテキストの公開ファサード + 公開 port + shared + clients
      #    だけを使い、内部層（internal/）へは到達しない。Go の internal パッケージ規則が
      #    これをコンパイル時に強制するが、意図を明示し二重に守るため depguard でも禁止する。
      dev-harness-public-only:
        files:
          - "**/cmd/dev/**"
        deny:
          - pkg: "github.com/example/go-ddd-template/contexts/inventory/internal"
            desc: "開発ハーネスは在庫コンテキストの internal/ に依存してはならない（公開ファサード inventory.Module と port だけを使う）"
          - pkg: "github.com/example/go-ddd-template/contexts/ordering/internal"
            desc: "開発ハーネスは注文コンテキストの internal/ に依存してはならない（公開ファサード ordering.Module と port だけを使う）"
      # 7) 共有モジュールは依存グラフの最下層。どのコンテキストにも、生成クライアントにも
      #    依存しない。依存は常に「コンテキスト → shared」の一方向である。
      #    これはドメイン値オブジェクト（SKU / Quantity / Money 等）を shared/ へ
      #    置かせないための機械的な歯止めでもある（従来は shared/go.mod のコメントによる
      #    規約だけで、強制は無かった）。型付きディスパッチャ event.Typed[E] のように
      #    ドメイン型を型パラメータで受ける設計が、import を増やしていないことも
      #    この rule が検証する。
      #    テストも対象に含める（除外しない方が強く、現状も違反は無い）。
      shared-purity:
        files:
          - "**/shared/**"
        deny:
          - pkg: "github.com/example/go-ddd-template/contexts"
            desc: "共有モジュールは境界づけられたコンテキストに依存してはならない（公開ファサードと port も含む。依存は常にコンテキスト → shared の一方向）"
          - pkg: "github.com/example/go-ddd-template/clients"
            desc: "共有モジュールは特定コンテキストの生成クライアントに依存してはならない"

issues:
  # 既定の除外パターンのうち EXC0011 だけを打ち消す。
  #
  # golangci-lint は既定でいくつかの「よくある指摘」を除外しており（exclude-use-default: true）、
  # そのうち EXC0011 が stylecheck の "should have (a package) comment" と
  # "comment should be of the form" を丸ごと握りつぶす。これを解除しないと、
  # linters.enable に stylecheck を足し checks: ["ST1000"] を書いても **1 件も報告されない**
  # ——「rule はあるが何も検査していない」状態になる（実際にカナリアで確認した:
  # package コメントを削っても lint は green のままだった）。
  #
  # include は既定除外の解除であって新しい検査の追加ではないため、影響は
  # stylecheck の checks で有効化した ST1000 の範囲に閉じる。
  include:
    - EXC0011
  # 報告の打ち切りを外す。
  #
  # golangci-lint の既定は max-same-issues: 3 / max-issues-per-linter: 50 で、
  # **同じ文言の指摘は 4 件目から黙って捨てられる**。実測: thelper の同一指摘が 5 件あるのに
  # 3 件しか出ず、その 3 件を直したあとに残り 2 件が現れた。green / red の判定自体は変わらない
  # （1 件でも残れば非 0 終了）が、「あと何件あるのか」を数えて是正の計画を立てる用途では
  # 嘘の数を返す。カナリア検証（注入した違反が当該 linter に到達したかを確かめる手順）でも
  # 打ち切りは害になる。教材としても「出ている件数がすべて」である方が正しい。
  max-same-issues: 0
  max-issues-per-linter: 0
  # 生成ファイルは検査しない（明示的な保険）。
  exclude-rules:
    - path: (oas_.*_gen\.go|sqlcgen/.*\.go)
      linters:
        - errcheck
        - staticcheck
        - unused
        - govet
        - gofmt
        - goimports
    # paralleltest のパス限定（C-5）。
    #
    # t.Parallel() を必須にするのは internal/domain と internal/application の
    # 「外部依存を持たない純粋テスト」だけである。アダプタ・統合テスト・fuzz ターゲットは
    # 対象外にする（fuzzing 中は T.Parallel が無効であり、DB や httptest を掴むテストを
    # 並列化しても速くならず、共有資源の競合を招くだけである）。
    #
    # linters.enable では全体に有効化し、ここで「domain と application 以外」を除外する。
    # 除外の書き方が二重否定になるのは golangci-lint v1 の exclude-rules に
    # 「このパスだけに限定する」という肯定形が無いためで、path の否定表現を使っている。
    #
    # この限定が実際に効いていることは**対で**カナリア検証する（G-1 / G-2）——
    # domain のテストから t.Parallel() を削ると報告され、アダプタ層で削っても
    # 報告されないことを 1 回の観測で同時に確かめる。片側だけでは
    # 「パス限定が効いている」のか「そもそも rule が不発」なのか区別できない。
    - path-except: internal/(domain|application)/
      linters:
        - paralleltest
