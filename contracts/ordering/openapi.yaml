openapi: 3.0.3
# 注文コンテキストの公開 HTTP 契約（コントラクトファースト）。
# この YAML が唯一の真実（source of truth）であり、ogen によって型安全な
# サーバコードを生成する。生成物はリポジトリにコミットし、手で編集しない。
# 契約を変えたいときは、この YAML を編集して `go generate ./...` で再生成する。
#
# この契約はコード生成の入力であると同時に、AI や人間の開発者が API の意図を
# 機械可読な形で読み取るためのガイドとしても機能する。
info:
  title: Ordering API
  version: 0.1.0
  description: |
    注文（Ordering）コンテキストの公開 API。注文の作成（place）・照会（get）・
    取消（cancel）を提供する。金額や数量の妥当性検証は、単一の真実の源である
    ドメイン層に委譲している。そのため契約側では値域を厳しく制約せず、不正値は
    ドメインのエラーとして RFC 9457 形式で返す。

    注文の作成は在庫の予約を伴う。作成ハンドラは在庫コンテキストへ腐敗防止層
    （ACL）越しに同期予約を要求し、予約できたときのみ注文を確定（Confirmed）する。
    在庫予約が拒否された場合は 409、在庫サービスが不達・タイムアウトの場合は 503 を返す。

servers:
  - url: /

paths:
  /orders:
    post:
      operationId: placeOrder
      summary: 注文を作成する
      description: |
        注文明細から注文を作成する。作成時に在庫を同期予約し、予約できたときのみ
        注文を Confirmed 状態で確定する。予約が拒否された場合は注文を作成しない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: 作成された注文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderView'
        # このオペレーションが実際に返しうる 4xx/5xx を明示する（errmap.go の classify に対応）。
        #   400 契約／本文の検証失敗（ErrorHandler 経由）
        #   409 在庫予約の拒否（reservation-rejected）または楽観的排他の衝突（conflict）
        #   422 ドメイン検証（顧客 ID・SKU・数量・金額・明細空 など）
        #   503 在庫サービス不達（reservation-unavailable）
        # 上記のどれにも当てはまらない未処理エラーは default（= 500）へ落ちる。
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /orders/{id}:
    get:
      operationId: getOrder
      summary: 注文を照会する
      description: 指定した注文 ID の現在の状態を返す。
      parameters:
        - $ref: '#/components/parameters/OrderIDPath'
      responses:
        '200':
          description: 現在の注文状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderView'
        # このオペレーションが実際に返しうる 4xx/5xx（errmap.go の classify に対応）。
        #   400 パスパラメータの契約検証失敗
        #   404 注文が存在しない（resource-not-found）
        #   422 注文 ID のドメイン検証失敗（例 空白のみ）
        # 上記以外の未処理エラーは default（= 500）へ落ちる。
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /orders/{id}/cancel:
    post:
      operationId: cancelOrder
      summary: 注文を取り消す
      description: |
        指定した注文を取り消す。取消できるのは Confirmed 状態の注文のみ。
        取消に伴う在庫の解放は非同期で行う（注文コンテキストは取消イベントを発行し、
        在庫コンテキストがそれを購読して解放する）。
      parameters:
        - $ref: '#/components/parameters/OrderIDPath'
      responses:
        '200':
          description: 取消後の注文状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderView'
        # このオペレーションが実際に返しうる 4xx/5xx（errmap.go の classify に対応）。
        #   400 パスパラメータの契約検証失敗
        #   404 注文が存在しない（resource-not-found）
        #   409 Confirmed 以外の注文の取消、または楽観的排他の衝突（conflict）
        #   422 注文 ID のドメイン検証失敗（例 空白のみ）
        # 上記以外の未処理エラーは default（= 500）へ落ちる。
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  # 出荷（Shipment）は注文とは別の集約ルートである。したがってパスも /orders/{id}/shipments
  # ではなく /shipments に置く。URL の階層は集約の階層を反映させる。注文への参照は
  # リクエスト本文の orderId で表す — 「集約間は識別子で参照する」を API の形でも示す。
  /shipments:
    post:
      operationId: prepareShipment
      summary: 出荷を準備する
      description: |
        指定した注文に対する出荷を準備する（preparing 状態で作成する）。準備できるのは
        confirmed 状態の注文に対してのみ。注文の確認は出荷トランザクションの外で行い、
        トランザクションの内では出荷だけを書き込む（1 トランザクション 1 集約ルート）。

        このオペレーションは冪等ではない。同じ注文に対して 2 回呼べば 2 つの出荷ができる。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepareShipmentRequest'
      responses:
        '201':
          description: 準備された出荷
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentView'
        # このオペレーションが実際に返しうる 4xx/5xx（errmap.go の classify に対応）。
        #   400 契約／本文の検証失敗（ErrorHandler 経由）
        #   404 注文が存在しない（resource-not-found）
        #   409 注文が confirmed でない（order-not-confirmed-for-shipment）
        #   422 注文 ID のドメイン検証失敗（例 空白のみ）
        # 上記以外の未処理エラーは default（= 500）へ落ちる。
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /shipments/{id}:
    get:
      operationId: getShipment
      summary: 出荷を照会する
      description: 指定した出荷 ID の現在の状態を返す。
      parameters:
        - $ref: '#/components/parameters/ShipmentIDPath'
      responses:
        '200':
          description: 現在の出荷状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentView'
        # このオペレーションが実際に返しうる 4xx/5xx（errmap.go の classify に対応）。
        #   400 パスパラメータの契約検証失敗
        #   404 出荷が存在しない（resource-not-found）
        #   422 出荷 ID のドメイン検証失敗（例 空白のみ）
        # 上記以外の未処理エラーは default（= 500）へ落ちる。
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  # 状態遷移をサブリソースへの POST で表す（POST /orders/{id}/cancel と同じ形）。
  /shipments/{id}/ship:
    post:
      operationId: markShipped
      summary: 出荷を発送済みにする
      description: |
        指定した出荷を発送済み（shipped）にし、追跡番号を確定する。遷移できるのは
        preparing 状態の出荷のみで、再発送は無い。更新は楽観的排他制御に従う。
      parameters:
        - $ref: '#/components/parameters/ShipmentIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkShippedRequest'
      responses:
        '200':
          description: 発送後の出荷状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentView'
        # このオペレーションが実際に返しうる 4xx/5xx（errmap.go の classify に対応）。
        #   400 契約／本文・パスパラメータの検証失敗
        #   404 出荷が存在しない（resource-not-found）
        #   409 出荷が preparing でない、または楽観的排他の衝突（conflict）
        #   422 出荷 ID・追跡番号のドメイン検証失敗（例 空白のみ）
        # 上記以外の未処理エラーは default（= 500）へ落ちる。
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

components:
  parameters:
    OrderIDPath:
      name: id
      in: path
      required: true
      description: 注文の識別子（不透明な ID）
      schema:
        type: string
        minLength: 1

    ShipmentIDPath:
      name: id
      in: path
      required: true
      description: 出荷の識別子（不透明な ID）
      schema:
        type: string
        minLength: 1

  responses:
    # RFC 9457 (Problem Details for HTTP APIs) 形式の共通エラー応答。
    # default 応答としてまとめて宣言することで、ogen はハンドラに NewError メソッドを
    # 生成する。ドメイン／アプリケーションのセンチネルエラーはこの NewError で HTTP
    # ステータスと problem+json 本文へ翻訳する。
    ProblemResponse:
      description: |
        RFC 9457 形式のエラー詳細。各オペレーションは自分が実際に返しうる 4xx/5xx を
        明示的に宣言し、既知のドメイン／検証エラーはそれらの宣言済みステータスへ写す。
        宣言のどれにも当てはまらない未処理のエラーは default（= 500 Internal Server Error）
        へ落ちる（classify の default 分岐 = 500）。
        なお 415（メディアタイプ非対応）と、経路レベルの 404（未定義パス）/ 405（メソッド
        不許可）はサーバ全体のトランスポート層（ServerOption ハンドラ）で生成されるため
        オペレーション単位では宣言できないが、同じ ProblemDetails 形状を共有する。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    Money:
      type: object
      description: 金額。最小通貨単位（例 円・セント）の整数と ISO-4217 通貨コードで表す。
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          format: int64
          description: 最小通貨単位での金額。非負であること（検証はドメイン層）。
        currency:
          type: string
          description: ISO-4217 の通貨コード（例 JPY, USD）。
      example:
        amount: 1200
        currency: JPY

    PlaceOrderLine:
      type: object
      required:
        - sku
        - quantity
        - unitPrice
      properties:
        sku:
          type: string
          description: 在庫識別子
        quantity:
          type: integer
          description: 注文数量。1 以上であること（検証はドメイン層）。
        unitPrice:
          $ref: '#/components/schemas/Money'

    PlaceOrderRequest:
      type: object
      required:
        - customerId
        - lines
      properties:
        customerId:
          type: string
          description: 注文者（顧客）の識別子
        lines:
          type: array
          description: 注文明細（1 行以上）
          items:
            $ref: '#/components/schemas/PlaceOrderLine'
      example:
        customerId: CUST-1
        lines:
          - sku: WIDGET-001
            quantity: 3
            unitPrice:
              amount: 1200
              currency: JPY

    OrderLineView:
      type: object
      required:
        - sku
        - quantity
        - unitPrice
        - subtotal
      properties:
        sku:
          type: string
          description: 在庫識別子
        quantity:
          type: integer
          description: 注文数量
        unitPrice:
          $ref: '#/components/schemas/Money'
        subtotal:
          $ref: '#/components/schemas/Money'

    OrderView:
      type: object
      required:
        - id
        - customerId
        - status
        - lines
        - total
        - reservationRef
        - version
      properties:
        id:
          type: string
          description: 注文の識別子
        customerId:
          type: string
          description: 注文者（顧客）の識別子
        status:
          type: string
          description: 注文状態（confirmed / cancelled）
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineView'
        total:
          $ref: '#/components/schemas/Money'
        reservationRef:
          type: string
          description: この注文が在庫予約に用いた予約参照（相関 ID）
        version:
          type: integer
          description: 楽観的排他制御のためのバージョン番号
      example:
        id: ORDER-abc
        customerId: CUST-1
        status: confirmed
        lines:
          - sku: WIDGET-001
            quantity: 3
            unitPrice:
              amount: 1200
              currency: JPY
            subtotal:
              amount: 3600
              currency: JPY
        total:
          amount: 3600
          currency: JPY
        reservationRef: ORDER-abc
        version: 1

    PrepareShipmentRequest:
      type: object
      required:
        - orderId
      properties:
        orderId:
          type: string
          description: |
            出荷対象の注文の識別子。集約間は識別子で参照するため、ここに載るのは
            注文の識別子だけであり、注文の明細や状態は載らない。
      example:
        orderId: ORDER-abc

    MarkShippedRequest:
      type: object
      required:
        - trackingNumber
      properties:
        trackingNumber:
          type: string
          description: 配送業者の追跡番号。空にはできない（検証はドメイン層）。
      example:
        trackingNumber: TRACK-0001

    ShipmentView:
      type: object
      required:
        - id
        - orderId
        - status
        - trackingNumber
        - version
      properties:
        id:
          type: string
          description: 出荷の識別子
        orderId:
          type: string
          description: 出荷対象の注文の識別子（識別子による参照。注文の射影は含まない）
        status:
          type: string
          description: 出荷状態（preparing / shipped）
        trackingNumber:
          type: string
          description: 配送業者の追跡番号。preparing の出荷では空文字。
        version:
          type: integer
          description: 楽観的排他制御のためのバージョン番号
      example:
        id: SHIP-abc
        orderId: ORDER-abc
        status: shipped
        trackingNumber: TRACK-0001
        version: 2

    ProblemDetails:
      type: object
      description: RFC 9457 (Problem Details for HTTP APIs) に準拠したエラー表現
      # 生成される Go のフィールド名を明示する。JSON 名 invalid-params はハイフンを
      # 含むため、ogen の既定では InvalidMinusParams という不自然な識別子になる。
      # x-ogen-properties は Go 側の名前だけを是正し、ワイヤ形式（JSON 名）は変えない。
      x-ogen-properties:
        invalid-params:
          name: InvalidParams
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: |
            問題の種別を示す安定した URI。クライアントは status ではなくこの値で分岐する。
            同じ status でも原因が異なれば別の URI を与える（例 404 は経路が無い
            not-found と、対象が無い resource-not-found に分かれる）。
            URI は識別子であり、解決可能である必要はない。
        title:
          type: string
          description: 問題種別の短い人間可読な要約
        status:
          type: integer
          description: HTTP ステータスコード
        detail:
          type: string
          description: 今回の発生に固有の人間可読な説明
        instance:
          type: string
          format: uri
          description: 問題が発生した具体的なリソースを示す URI
        invalid-params:
          type: array
          description: |
            違反したフィールドの一覧（RFC 9457 の拡張メンバー）。
            フィールドを特定できない場合はこのメンバー自体を省略する（空配列は返さない）。
            判明した違反のみを含み、網羅は保証しない。
          items:
            $ref: '#/components/schemas/InvalidParam'
      example:
        type: https://github.com/example/go-ddd-template/problems/conflict
        title: Conflict
        status: 409
        detail: 現在の状態ではこの操作を実行できません

    InvalidParam:
      type: object
      description: |
        1 件のフィールド違反。RFC 9457 の拡張メンバー invalid-params の要素。
      required:
        - name
        - code
      properties:
        name:
          type: string
          description: |
            違反したフィールドのパス（ドット + 角括弧記法）。
            契約検証（400）では配列添字は付かない。ドメイン検証（422）では付く。
            クライアントは添字の有無に依存した解析をしてはならない。
        code:
          type: string
          description: |
            機械可読な違反理由。語彙は type によって決まる
            （validation-error なら契約検証語彙、invalid-input ならドメイン検証語彙）。
            enum はこの契約のサーバが実際に載せうる値の全体（契約検証語彙 ∪ 注文コンテキストの
            ドメイン検証語彙）。新しいドメイン検証規則（domain.Rule）を足したら、その code を
            ここへも足す（規則 R-19。手順は CONVENTIONS.md）。
          enum:
            # 契約検証語彙（400 / validation-error）。shared/problem/vocab.go が唯一の情報源。
            - required
            - type
            - min_length
            - max_length
            - pattern
            - unique_items
            - invalid_param
            - body_required
            - invalid
            # ドメイン検証語彙（422 / invalid-input）。注文コンテキストが所有する
            # （contexts/ordering/internal/domain/errors.go の domain.Rule）。
            - empty_order
            - invalid_sku
            - invalid_quantity
            - invalid_money_amount
            - invalid_money_currency
            - invalid_customer_id
            - invalid_order_id
            - invalid_reservation_ref
            - invalid_shipment_id
            - invalid_tracking_number
        reason:
          type: string
          description: 人間可読な説明。code から導出される定型文であり、受信値を含まない。
      example:
        name: lines[0].quantity
        code: invalid_quantity
        reason: 1 以上の値を指定してください
