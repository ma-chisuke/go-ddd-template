openapi: 3.0.3
# 在庫コンテキストの「内部」HTTP 契約（コントラクトファースト）。
# 公開 API（openapi.yaml：補充・照会）とは別に、サービス間連携のための内部エンドポイントを
# 定義する。予約・確定・解放と、クロスコンテキストメッセージの取り込み（event-ingest）を提供する。
#
# この内部サーバは公開サーバとは別の「サーバ / ルート群」として動かす（合成ルートで結線）。
# ogen によってサーバコードを生成し、生成物はコミットして手で編集しない。
info:
  title: Inventory Internal API
  version: 0.1.0
  description: |
    在庫コンテキストの内部 API。サービス間連携（予約の二相コミットや取消の反映）と、
    アウトボックスのメッセージ取り込み（event-ingest → outbox.Router.Deliver）に用いる。
    数量や参照の妥当性検証は、単一の真実の源であるドメイン層に委譲する。

servers:
  - url: /

paths:
  /reservations:
    post:
      operationId: reserveStock
      summary: 在庫を予約する（マルチ SKU・全か無か）
      description: 1 つの予約参照に対して複数 SKU をまとめて仮予約する。1 つでも在庫不足なら全体を失敗させる。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveCommand'
      responses:
        '200':
          description: 予約結果の確認応答
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /reservations/{ref}/confirm:
    post:
      operationId: confirmReservation
      summary: 予約を確定する（pending → confirmed）
      description: 指定参照の予約を確定する。有効な予約が無ければ 404 を返す。
      parameters:
        - $ref: '#/components/parameters/RefPath'
      responses:
        '200':
          description: 確定結果の確認応答
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /reservations/{ref}/release:
    post:
      operationId: releaseReservation
      summary: 予約を解放する
      description: 指定参照の予約を解放して在庫を戻す。未知・解放済みの参照でも冪等に成功する。
      parameters:
        - $ref: '#/components/parameters/RefPath'
      responses:
        '200':
          description: 解放結果の確認応答
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /events:
    post:
      operationId: ingestEvent
      summary: クロスコンテキストメッセージを取り込む
      description: |
        受信したメッセージを outbox.Router へ委譲し、message_type に応じた Consumer が処理する。
        未登録の種別は 422 を返す（黙って捨てない）。payload は翻訳済み契約のシリアライズ（JSON 文字列）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundMessage'
      responses:
        '200':
          description: 取り込み結果の確認応答
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        default:
          $ref: '#/components/responses/ProblemResponse'

components:
  parameters:
    RefPath:
      name: ref
      in: path
      required: true
      description: 予約参照（不透明な相関 ID）
      schema:
        type: string
        minLength: 1

  responses:
    ProblemResponse:
      description: |
        RFC 9457 形式のエラー詳細。エラー応答はすべて default（= このコンテキストが返しうる
        4xx/5xx すべて。classify を参照）として 1 つにまとめて宣言する。

        公開契約（openapi.yaml）と違い、この内部契約はオペレーション単位の明示ステータス
        （'400' / '409' など）を **あえて宣言しない**。理由は消費のされ方にある: この契約から
        生成されるのはサーバではなく **クライアント**（clients/inventory）であり、その唯一の
        利用者は注文コンテキストの腐敗防止層（ACL）である。ACL はステータスコードのみを見て
        自分の番兵へ翻訳する（規則 R-16）。ogen は default だけのとき、非 2xx をすべて 1 つの
        型付きエラー（ProblemResponseStatusCode）としてクライアントに返す（convenient errors）。
        ここに明示ステータスを足すと、宣言済みコードがエラーではなく union の値としてクライアントに
        返るようになり、ACL の「非 2xx = エラー」翻訳が壊れる（かつ ACL はコード別分岐を必要と
        しない）。よってこの契約は default 集約のままにする。

        なお 415（メディアタイプ非対応）と、経路レベルの 404（未定義パス）/ 405（メソッド
        不許可）はサーバ全体のトランスポート層（ServerOption ハンドラ）で生成され、同じ
        ProblemDetails 形状を共有する。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    ReserveCommand:
      type: object
      required:
        - ref
        - lines
      properties:
        ref:
          type: string
          description: 予約参照（不透明な相関 ID）
        lines:
          type: array
          description: 予約する SKU と数量の一覧
          items:
            $ref: '#/components/schemas/ReserveLine'
      example:
        ref: ORDER-1
        lines:
          - sku: WIDGET-001
            quantity: 3

    ReserveLine:
      type: object
      required:
        - sku
        - quantity
      properties:
        sku:
          type: string
          description: 在庫識別子
        quantity:
          type: integer
          description: 予約する数量。値の妥当性検証はドメイン層が行う。

    InboundMessage:
      type: object
      description: アウトボックスの受信メッセージ封筒
      required:
        - id
        - type
        - payload
      properties:
        id:
          type: string
          description: メッセージの一意な識別子
        type:
          type: string
          description: message_type（Consumer を選択する種別）
        payload:
          type: string
          description: 翻訳済み契約のシリアライズ（JSON 文字列）
        trace_id:
          type: string
          description: seam を跨ぐ相関 ID
        occurred_at:
          type: string
          format: date-time
          description: メッセージ発生時刻
      example:
        id: msg-1
        type: ordering.order.cancelled
        payload: '{"reservation_ref":"ORDER-1"}'
        trace_id: trace-1

    Ack:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: "処理結果（例 accepted）"
      example:
        status: accepted

    ProblemDetails:
      type: object
      description: RFC 9457 (Problem Details for HTTP APIs) に準拠したエラー表現
      # 生成される Go のフィールド名を明示する。JSON 名 invalid-params はハイフンを
      # 含むため、ogen の既定では InvalidMinusParams という不自然な識別子になる。
      # x-ogen-properties は Go 側の名前だけを是正し、ワイヤ形式（JSON 名）は変えない。
      x-ogen-properties:
        invalid-params:
          name: InvalidParams
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: |
            問題の種別を示す安定した URI。クライアントは status ではなくこの値で分岐する。
            同じ status でも原因が異なれば別の URI を与える（例 404 は経路が無い
            not-found と、対象が無い resource-not-found に分かれる）。
            URI は識別子であり、解決可能である必要はない。
        title:
          type: string
          description: 問題種別の短い人間可読な要約
        status:
          type: integer
          description: HTTP ステータスコード
        detail:
          type: string
          description: 今回の発生に固有の人間可読な説明
        instance:
          type: string
          format: uri
          description: 問題が発生した具体的なリソースを示す URI
        invalid-params:
          type: array
          description: |
            違反したフィールドの一覧（RFC 9457 の拡張メンバー）。
            フィールドを特定できない場合はこのメンバー自体を省略する（空配列は返さない）。
            判明した違反のみを含み、網羅は保証しない。
            腐敗防止層（ACL）はステータスコードのみを見るため、このメンバーの追加で
            呼び出し側の翻訳結果は変わらない（規則 R-16）。
          items:
            $ref: '#/components/schemas/InvalidParam'
      example:
        type: https://github.com/example/go-ddd-template/problems/resource-not-found
        title: Not Found
        status: 404
        detail: 要求されたリソースは存在しません

    InvalidParam:
      type: object
      description: |
        1 件のフィールド違反。RFC 9457 の拡張メンバー invalid-params の要素。
      required:
        - name
        - code
      properties:
        name:
          type: string
          description: |
            違反したフィールドのパス（ドット + 角括弧記法）。
            契約検証（400）では配列添字は付かない。ドメイン検証（422）では付く。
            クライアントは添字の有無に依存した解析をしてはならない。
        code:
          type: string
          description: |
            機械可読な違反理由。語彙は type によって決まる
            （validation-error なら契約検証語彙、invalid-input ならドメイン検証語彙）。
            enum はこの内部契約のサーバが実際に載せうる値の全体（契約検証語彙 ∪ 在庫コンテキストの
            ドメイン検証語彙）。新しいドメイン検証規則（inventory.Rule）を足したら、その code を
            ここへも足す（規則 R-19。手順は CONVENTIONS.md）。
          enum:
            # 契約検証語彙（400 / validation-error）。shared/problem/vocab.go が唯一の情報源。
            - required
            - type
            - min_length
            - max_length
            - pattern
            - unique_items
            - invalid_param
            - body_required
            - invalid
            # ドメイン検証語彙（422 / invalid-input）。在庫コンテキストが所有する
            # （contexts/inventory/internal/domain/inventory/errors.go の inventory.Rule）。
            - invalid_sku
            - invalid_quantity
            - invalid_reservation_ref
        reason:
          type: string
          description: 人間可読な説明。code から導出される定型文であり、受信値を含まない。
      example:
        name: lines[0].quantity
        code: invalid_quantity
        reason: 0 以上の値を指定してください
