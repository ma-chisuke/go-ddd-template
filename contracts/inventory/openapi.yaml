openapi: 3.0.3
# 在庫コンテキストの公開 HTTP 契約（コントラクトファースト）。
# この YAML が唯一の真実（source of truth）であり、ogen によって型安全な
# サーバコードを生成する。生成物はリポジトリにコミットし、手で編集しない。
# 契約を変えたいときは、この YAML を編集して `go generate ./...` で再生成する。
#
# この契約はコード生成の入力であると同時に、AI や人間の開発者が API の意図を
# 機械可読な形で読み取るためのガイドとしても機能する。
info:
  title: Inventory API
  version: 0.1.0
  description: |
    在庫（Inventory）コンテキストの公開 API。
    在庫の補充（replenish）と在庫数の照会（query）のみを提供する最小スライス。
    数量の妥当性（非負など）の検証は、単一の真実の源であるドメイン層に委譲している。
    そのため契約側では値域を厳しく制約せず、不正値はドメインのエラーとして
    RFC 9457 形式で返す。

servers:
  - url: /

paths:
  /stock/{sku}/replenish:
    post:
      operationId: replenishStock
      summary: 在庫を補充する
      description: 指定した SKU の在庫を補充する。SKU が未登録の場合は新規に作成してから補充する。
      parameters:
        - $ref: '#/components/parameters/SKUPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplenishRequest'
      responses:
        '200':
          description: 補充後の在庫状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockView'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /stock/{sku}:
    get:
      operationId: getStock
      summary: 在庫を照会する
      description: 指定した SKU の現在の在庫状態を返す。
      parameters:
        - $ref: '#/components/parameters/SKUPath'
      responses:
        '200':
          description: 現在の在庫状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockView'
        default:
          $ref: '#/components/responses/ProblemResponse'

components:
  parameters:
    SKUPath:
      name: sku
      in: path
      required: true
      description: 在庫識別子（Stock Keeping Unit）
      schema:
        type: string
        minLength: 1

  responses:
    # RFC 9457 (Problem Details for HTTP APIs) 形式の共通エラー応答。
    # default 応答としてまとめて宣言することで、ogen はハンドラに NewError メソッドを
    # 生成する。ドメインのセンチネルエラーはこの NewError で HTTP ステータスと
    # problem+json 本文へ翻訳する。
    ProblemResponse:
      description: RFC 9457 形式のエラー詳細
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    ReplenishRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          description: 補充する数量。値の妥当性検証はドメイン層が行う。
      example:
        quantity: 10

    StockView:
      type: object
      required:
        - sku
        - available
        - reserved
        - version
      properties:
        sku:
          type: string
          description: 在庫識別子
        available:
          type: integer
          description: 利用可能在庫数
        reserved:
          type: integer
          description: 引当済み在庫数（有効な予約 pending + confirmed の合計。予約・確定・解放は内部 API で行う）
        version:
          type: integer
          description: 楽観的排他制御のためのバージョン番号
      example:
        sku: WIDGET-001
        available: 10
        reserved: 0
        version: 1

    ProblemDetails:
      type: object
      description: RFC 9457 (Problem Details for HTTP APIs) に準拠したエラー表現
      # 生成される Go のフィールド名を明示する。JSON 名 invalid-params はハイフンを
      # 含むため、ogen の既定では InvalidMinusParams という不自然な識別子になる。
      # x-ogen-properties は Go 側の名前だけを是正し、ワイヤ形式（JSON 名）は変えない。
      x-ogen-properties:
        invalid-params:
          name: InvalidParams
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: |
            問題の種別を示す安定した URI。クライアントは status ではなくこの値で分岐する。
            同じ status でも原因が異なれば別の URI を与える（例 404 は経路が無い
            not-found と、対象が無い resource-not-found に分かれる）。
            URI は識別子であり、解決可能である必要はない。
        title:
          type: string
          description: 問題種別の短い人間可読な要約
        status:
          type: integer
          description: HTTP ステータスコード
        detail:
          type: string
          description: 今回の発生に固有の人間可読な説明
        instance:
          type: string
          format: uri
          description: 問題が発生した具体的なリソースを示す URI
        invalid-params:
          type: array
          description: |
            違反したフィールドの一覧（RFC 9457 の拡張メンバー）。
            フィールドを特定できない場合はこのメンバー自体を省略する（空配列は返さない）。
            判明した違反のみを含み、網羅は保証しない。
          items:
            $ref: '#/components/schemas/InvalidParam'
      example:
        type: https://github.com/example/go-ddd-template/problems/resource-not-found
        title: Not Found
        status: 404
        detail: 要求されたリソースは存在しません

    InvalidParam:
      type: object
      description: |
        1 件のフィールド違反。RFC 9457 の拡張メンバー invalid-params の要素。
      required:
        - name
        - code
      properties:
        name:
          type: string
          description: |
            違反したフィールドのパス（ドット + 角括弧記法）。
            契約検証（400）では配列添字は付かない。ドメイン検証（422）では付く。
            クライアントは添字の有無に依存した解析をしてはならない。
        code:
          type: string
          description: |
            機械可読な違反理由。語彙は type によって決まる
            （validation-error なら契約検証語彙、invalid-input ならドメイン検証語彙）。
            enum はこの契約のサーバが実際に載せうる値の全体（契約検証語彙 ∪ 在庫コンテキストの
            ドメイン検証語彙）。新しいドメイン検証規則（inventory.Rule）を足したら、その code を
            ここへも足す（規則 R-19。手順は CONVENTIONS.md）。
          enum:
            # 契約検証語彙（400 / validation-error）。shared/problem/vocab.go が唯一の情報源。
            - required
            - type
            - min_length
            - max_length
            - pattern
            - unique_items
            - invalid_param
            - body_required
            - invalid
            # ドメイン検証語彙（422 / invalid-input）。在庫コンテキストが所有する
            # （contexts/inventory/internal/domain/inventory/errors.go の inventory.Rule）。
            - invalid_sku
            - invalid_quantity
            - invalid_reservation_ref
        reason:
          type: string
          description: 人間可読な説明。code から導出される定型文であり、受信値を含まない。
      example:
        name: quantity
        code: invalid_quantity
        reason: 0 以上の値を指定してください
